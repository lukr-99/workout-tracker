# 3 GB for Gradle and 4 GB for the Kotlin daemon: linking the web edition (Kotlin/Wasm) runs out of
# memory with the old 2 GB.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.5.2 is intentionally pinned for the checked-in Kotlin/KSP toolchain; compileSdk 35 is
# supported by the installed SDK and exercised in CI/device verification.
android.suppressUnsupportedCompileSdk=35
