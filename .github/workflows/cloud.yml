name: Claude server

# Typechecks and tests the Claude connector Worker in cloud/ whenever it changes. Deploying stays a
# manual step (npm run deploy from cloud/); nothing here talks to Cloudflare. See cloud/README.md.
on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `wrangler types` writes worker-configuration.d.ts from wrangler.jsonc; it needs no login.
      - name: Typecheck
        run: npm run typecheck

      # Vitest in the Workers runtime, including contract.test.ts, which reads the share that the
      # app's ClaudeShareContractTest writes (test/fixtures/ember-share.json).
      - name: Test
        run: npm test
