name: Web edition

# Builds and checks the browser edition (:web) whenever its code or the shared app code changes.
# Deploying to Cloudflare Pages is a separate, manual step: run this workflow by hand with
# "deploy" ticked. Nothing here deploys on push. See docs/web-edition.md.
on:
  push:
    paths:
      - "web/**"
      # :web compiles the shared domain, data and UI code straight from the app.
      - "app/src/main/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "kotlin-js-store/**"
      - "tools/stamp_web_dist.py"
      - "tools/test_stamp_web_dist.py"
      - "tools/check-web-dist.cjs"
      - "tools/render-web-icons.cjs"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      # :web compiles the shared domain, data and UI code straight from the app.
      - "app/src/main/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "kotlin-js-store/**"
      - "tools/stamp_web_dist.py"
      - "tools/test_stamp_web_dist.py"
      - "tools/check-web-dist.cjs"
      - "tools/render-web-icons.cjs"
      - ".github/workflows/web.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this build to Cloudflare Pages (needs the web-production environment)"
        type: boolean
        default: false
      channel:
        description: "production is the main site; preview gets its own preview URL"
        type: choice
        options:
          - preview
          - production
        default: preview

# Least privilege: building only reads the repository. The deploy job talks to Cloudflare with its
# own token and needs nothing more from GitHub.
permissions:
  contents: read

env:
  DIST: web/build/dist/wasmJs/productionExecutable
  # The version tools/check-web-dist.cjs is tested with.
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # settings.gradle.kts also includes :app, and the Android Gradle plugin needs an SDK to
      # configure it even when only :web tasks run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to "tools platform-tools", and sdkmanager no longer offers the legacy
          # "tools" package.
          packages: platform-tools

      # Node.js, Yarn and Binaryen download through the repositories in settings.gradle.kts. Do not
      # pass -Pember.web.systemYarn here; that is only for machines that cannot reach GitHub.
      - name: Build the production web distribution
        run: |
          chmod +x gradlew
          ./gradlew :web:wasmJsBrowserDistribution --stacktrace

      - name: Run web tests
        run: |
          ./gradlew :web:wasmJsNodeTest --stacktrace
          # A source set without tests skips the task, which is fine but worth seeing.
          if ! find web/build/test-results -name '*.xml' 2>/dev/null | grep -q .; then
            echo "::notice title=Web tests::No web tests ran (web/src/wasmJsTest has none)."
          fi

      - name: Test the stamping script
        run: python3 tools/test_stamp_web_dist.py

      # Writes the build id and file hashes into sw.js, adds immutable caching for hashed files to
      # _headers, and fails if a file breaks a Cloudflare Pages limit.
      - name: Stamp the distribution for Cloudflare Pages
        run: python3 tools/stamp_web_dist.py "$DIST"

      # Serves the stamped build with its own _headers (CSP included) and checks it in Chromium:
      # loading screen, first frame, offline reload, and the fallback screens.
      - name: Check the distribution in a browser
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node tools/check-web-dist.cjs "$DIST"

      - name: Upload the web distribution
        uses: actions/upload-artifact@v7
        with:
          name: ember-web
          path: ${{ env.DIST }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-reports
          path: |
            web/build/reports/tests/
            web/build/test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Only ever by hand, and only when asked: a push or pull request never deploys. Production
    # only from main, so a branch cannot replace the live site.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && (inputs.channel != 'production' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment holds the Cloudflare secrets and can require an approval and limit which
    # branches may deploy (Settings > Environments > web-production).
    environment:
      name: web-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: web-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      # Fail closed: without both secrets there is nothing safe to do.
      - name: Verify Cloudflare secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "Missing secret: $v"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to deploy. Add both secrets to the web-production environment;"
            echo "see docs/web-edition.md, section Deploy to Cloudflare Pages."
            exit 1
          fi

      # Cloudflare treats the project's production branch ("main") as the live site and any other
      # branch name as a preview.
      - name: Choose the Cloudflare branch
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            production) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            preview) echo "branch=preview" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown channel: $CHANNEL"; exit 1 ;;
          esac

      - name: Download the web distribution
        uses: actions/download-artifact@v8
        with:
          name: ember-web
          path: ${{ env.DIST }}

      # web/wrangler.toml names the project and points at the distribution folder.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned major version (also the action's default), so a Wrangler 5 cannot slip in.
          wranglerVersion: "4"
          workingDirectory: web
          command: pages deploy --branch=${{ steps.channel.outputs.branch }} --commit-hash=${{ github.sha }}
