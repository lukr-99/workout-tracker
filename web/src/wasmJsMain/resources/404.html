<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found - Ember</title>
  <link rel="stylesheet" href="/boot.css">
</head>
<body>
  <!-- Its presence also stops Cloudflare Pages from answering missing files with index.html
       (its single-page-app fallback), which would hand the app HTML instead of a font or script. -->
  <div class="screen">
    <h1>This page is not here</h1>
    <p>The page you asked for does not exist.</p>
    <p><a href="/">Open Ember</a></p>
  </div>
</body>
</html>
