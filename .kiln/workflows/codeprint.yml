name: Repository baseline

jobs:
  validate:
    runs-on: ubuntu-latest
    container: codeprint/runner:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate repository
        run: python3 tools/validate_repository.py --root .

      - name: Check PowerShell syntax
        shell: pwsh
        run: ./tools/test-powershell-syntax.ps1
