name: Claude server (Kiln)

# Local twin of .github/workflows/cloud.yml: typecheck and test the Claude connector Worker in cloud/.
# Nothing here talks to Cloudflare or needs a secret. Deploying stays a manual step (npm run deploy).

jobs:
  test:
    runs-on: ubuntu-latest
    container: codeprint/runner:latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
